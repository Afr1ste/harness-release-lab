[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "harness-release-lab"
version = "0.2.5"
description = "State-based release gates for tool-using agents. Reproduce ambiguous writes before shipping."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.12,<3",
  "PyYAML>=6,<7",
]

[project.urls]
Repository = "https://github.com/Afr1ste/harness-release-lab"
Issues = "https://github.com/Afr1ste/harness-release-lab/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
dsh = ["deepseek-harness-sdk==0.2.1rc2"]
pydantic-ai = ["pydantic-ai-slim==2.59.0"]

[project.scripts]
hrl = "harness_release_lab.cli:main"

[project.entry-points.pytest11]
harness_release_lab = "harness_release_lab.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_release_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
