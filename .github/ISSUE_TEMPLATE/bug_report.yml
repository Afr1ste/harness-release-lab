name: Reproducible contract failure
description: Report a failed contract, runtime integration issue or false verdict.
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Command, scenario, expected and observed behavior. Remove credentials.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, Lab version, DSH runtime version.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Relevant failed checks and redacted events from report.json.
